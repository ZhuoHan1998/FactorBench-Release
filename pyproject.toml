[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-bench"
version = "0.1.0"
description = "Portfolio-aware factor evaluation benchmark"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "FactorBench Contributors"},
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "pyarrow>=12.0",
    "jinja2>=3.1",
    "seaborn>=0.12",
    # The evaluation CLIs (compare, audit, ic_table, redundancy) are fire
    # entry points, and evaluating code factors round-trips HDF5 via pandas.
    # Both were previously declared only under the optional "mining" extra, so
    # `pip install -e .` produced an install whose own CLIs could not start.
    "fire",
    "tables>=3.8",
]

[project.optional-dependencies]
optimization = ["cvxpy>=1.4"]
data = ["yfinance>=0.2"]
mining = [
    "torch>=2.0",
    "gymnasium>=0.29",
    "stable-baselines3>=2.0",
    "sb3-contrib>=2.0",
    "tensorboard>=2.14",
    "tqdm>=4.65",
    "fire",
    "tables>=3.8",
]
# AlphaSAGE's GFlowNet stack. Install ONLY into a separate .venv-alphasage:
# torchgfn pulls tensordict, which pins numpy < 2 and would break the main
# environment (pandas 3 / cvxpy). See factor_mining/vendor/alphasage/VENDOR.md.
alphasage = [
    "torch>=2.0",
    "torchgfn==1.2.1",
    "torch-geometric==2.6.1",
    "gymnasium>=0.29",
    "tensorboard>=2.14",
    "tqdm>=4.65",
    "fire",
    "tables>=3.8",
]
viz = ["plotly>=5.6"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]
all = ["portfolio-factor-bench[optimization,data,mining,viz,dev]"]

[tool.setuptools.packages.find]
include = ["factor_bench*", "factor_mining*", "factor_map*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100
# Vendored official implementations are kept byte-identical to upstream.
extend-exclude = ["factor_mining/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
